<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Ritesh — Build. Contribute. Repeat.</title>
  <desc id="desc">A custom engineering log with a branching circuit that connects an idea to a patch and an upstream contribution.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#263547" stroke-width=".7"/></pattern>
    <radialGradient id="wash"><stop stop-color="#c4f56a" stop-opacity=".10"/><stop offset="1" stop-color="#c4f56a" stop-opacity="0"/></radialGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c4f56a"/><stop offset="1" stop-color="#4ea9aa"/></linearGradient>
    <style>.mono{font-family:Consolas,'Liberation Mono',monospace}.sans{font-family:'Segoe UI',Arial,sans-serif}@media(prefers-reduced-motion:reduce){.signal{display:none}}</style>
  </defs>
  <rect x="1" y="1" width="1198" height="418" rx="24" fill="#0b1017" stroke="#263547"/>
  <rect x="710" y="2" width="466" height="416" rx="24" fill="url(#grid)" opacity=".7"/>
  <ellipse cx="995" cy="208" rx="245" ry="205" fill="url(#wash)"/>
  <path d="M56 79H1144" stroke="#263547"/>
  <circle cx="63" cy="45" r="5" fill="#c4f56a"/>
  <text x="82" y="50" fill="#91a2b6" font-size="14" letter-spacing="2" class="mono">RITESH17RB / ENGINEERING LOG</text>
  <text x="1144" y="50" text-anchor="end" fill="#c4f56a" font-size="13" letter-spacing="1" class="mono">ALWAYS A WORK IN PROGRESS</text>
  <text x="50" y="199" fill="#eef4f7" font-size="112" font-weight="800" letter-spacing="-6" class="sans">RITESH<tspan fill="#c4f56a">.</tspan></text>
  <text x="56" y="254" fill="#eef4f7" font-size="32" font-weight="500" letter-spacing="-.8" class="sans">Build. Contribute. Repeat.</text>
  <text x="57" y="297" fill="#91a2b6" font-size="18" class="mono">Full-stack products. Developer tools. Open source.</text>
  <rect x="56" y="338" width="278" height="35" rx="17.5" fill="#111a24" stroke="#263547"/>
  <text x="75" y="361" fill="#c4f56a" font-size="14" class="mono">idea → code → contribution</text>
  <g fill="none" stroke-linecap="round">
    <path d="M817 155H1077M887 155C922 155 916 272 957 272H1077" stroke="#263547" stroke-width="3"/>
    <path d="M817 155H887C922 155 916 272 957 272H1007C1042 272 1038 155 1077 155" stroke="url(#route)" stroke-width="3"/>
    <path d="M817 155V319M1077 155V319" stroke="#263547" stroke-dasharray="3 7"/>
  </g>
  <g stroke="#c4f56a" stroke-width="2" fill="#0b1017">
    <circle cx="817" cy="155" r="10"/><circle cx="887" cy="155" r="7"/>
    <circle cx="957" cy="272" r="10"/><circle cx="1077" cy="155" r="10"/>
  </g>
  <circle cx="817" cy="155" r="4" fill="#c4f56a"/>
  <path d="M953 272H961M957 268V276M1073 155H1081M1077 151V159" stroke="#c4f56a" stroke-width="2"/>
  <circle class="signal" r="4" fill="#c4f56a"><animateMotion dur="7s" repeatCount="indefinite" path="M817 155H887C922 155 916 272 957 272H1007C1042 272 1038 155 1077 155"/></circle>
  <g fill="#91a2b6" font-size="14" letter-spacing="1.5" class="mono">
    <text x="817" y="127" text-anchor="middle">IDEA</text>
    <text x="957" y="310" text-anchor="middle">PATCH</text>
    <text x="1077" y="127" text-anchor="middle">UPSTREAM</text>
  </g>
  <text x="946" y="366" text-anchor="middle" fill="#eef4f7" font-size="17" class="mono">small diffs. real progress.</text>
</svg>
